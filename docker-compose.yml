version: '3.8'

services:
  ulpf-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ulpf-core-engine
    restart: unless-stopped
    ports:
      - "8000:8000"      # Dashboard UI & REST API
      - "5140:5140/udp"  # UDP Syslog Listener
      - "1514:1514"      # TCP Syslog Listener
    volumes:
      - ulpf_data:/app/data
    environment:
      - ULPF_AIR_GAPPED=1
      - ULPF_SECRET_KEY=ulpf-ntro-sih2026-airgap-secure-key-32bytes
      - PYTHONUNBUFFERED=1
    networks:
      - ulpf-airgap-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/pipeline/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  ulpf_data:
    driver: local

networks:
  ulpf-airgap-net:
    driver: bridge
    internal: true  # Enforces 100% Air-Gapped Network Isolation (No external internet routing)
