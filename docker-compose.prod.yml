version: '3.8'

# ==============================================================================
# ULPF — Universal Log Pre-processing Framework (SIH26156 / NTRO)
# Production Air-Gapped Stack (MinIO + OpenSearch + API Gateway + Worker Pool)
#
# SECURITY REQUIREMENTS:
# - No hardcoded secrets: inject credentials via .env file or orchestrator secrets.
# - Network isolation: internal: true enforces complete air-gapped network perimeter.
# - Least Privilege: MinIO and OpenSearch do not expose management ports to host.
# ==============================================================================

services:
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: ulpf-minio-raw-store
    restart: unless-stopped
    command: server /data
    environment:
      - MINIO_ROOT_USER=${ULPF_MINIO_ACCESS_KEY:?Error: ULPF_MINIO_ACCESS_KEY is required}
      - MINIO_ROOT_PASSWORD=${ULPF_MINIO_SECRET_KEY:?Error: ULPF_MINIO_SECRET_KEY is required}
    expose:
      - "9000"
    volumes:
      - ulpf_minio_data:/data
    networks:
      - ulpf-airgap-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: ulpf-opensearch-siem
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=false
      - plugins.security.ssl.http.enabled=false
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${ULPF_OPENSEARCH_PASSWORD:?Error: ULPF_OPENSEARCH_PASSWORD is required}
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    expose:
      - "9200"
    volumes:
      - ulpf_opensearch_data:/usr/share/opensearch/data
    networks:
      - ulpf-airgap-net
    healthcheck:
      test: ["CMD", "curl", "-f", "-u", "${ULPF_OPENSEARCH_USERNAME:-admin}:${ULPF_OPENSEARCH_PASSWORD}", "http://localhost:9200/_cluster/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  ulpf-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ulpf-api-gateway
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "8000:8000"      # Web Dashboard UI & REST API Gateway
      - "5140:5140/udp"  # UDP Syslog Ingestion
      - "1514:1514"      # TCP Syslog Ingestion
    volumes:
      - ulpf_app_data:/app/data
    environment:
      - ULPF_ENV=production
      - ULPF_DEMO_MODE=false
      - ULPF_AIR_GAPPED=true
      - ULPF_SECRET_KEY=${ULPF_SECRET_KEY:?Error: ULPF_SECRET_KEY is required}
      - ULPF_STORAGE_BACKEND=minio
      - ULPF_MINIO_ENDPOINT=minio:9000
      - ULPF_MINIO_ACCESS_KEY=${ULPF_MINIO_ACCESS_KEY}
      - ULPF_MINIO_SECRET_KEY=${ULPF_MINIO_SECRET_KEY}
      - ULPF_MINIO_RAW_BUCKET=${ULPF_MINIO_RAW_BUCKET:-ulpf-raw}
      - ULPF_SEARCH_BACKEND=opensearch
      - ULPF_OPENSEARCH_URL=http://opensearch:9200
      - ULPF_OPENSEARCH_USERNAME=${ULPF_OPENSEARCH_USERNAME:-admin}
      - ULPF_OPENSEARCH_PASSWORD=${ULPF_OPENSEARCH_PASSWORD}
      - ULPF_OPENSEARCH_INDEX_PREFIX=${ULPF_OPENSEARCH_INDEX_PREFIX:-ulpf-events-v1}
      - ULPF_QUEUE_BACKEND=sqlite_queue
      - PYTHONUNBUFFERED=1
    networks:
      - ulpf-airgap-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/pipeline/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ulpf-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ulpf-processing-worker
    restart: unless-stopped
    command: ["python", "-m", "ulpf.services.processing.worker"]
    depends_on:
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - ulpf_app_data:/app/data
    environment:
      - ULPF_ENV=production
      - ULPF_DEMO_MODE=false
      - ULPF_AIR_GAPPED=true
      - ULPF_SECRET_KEY=${ULPF_SECRET_KEY}
      - ULPF_STORAGE_BACKEND=minio
      - ULPF_MINIO_ENDPOINT=minio:9000
      - ULPF_MINIO_ACCESS_KEY=${ULPF_MINIO_ACCESS_KEY}
      - ULPF_MINIO_SECRET_KEY=${ULPF_MINIO_SECRET_KEY}
      - ULPF_MINIO_RAW_BUCKET=${ULPF_MINIO_RAW_BUCKET:-ulpf-raw}
      - ULPF_SEARCH_BACKEND=opensearch
      - ULPF_OPENSEARCH_URL=http://opensearch:9200
      - ULPF_OPENSEARCH_USERNAME=${ULPF_OPENSEARCH_USERNAME:-admin}
      - ULPF_OPENSEARCH_PASSWORD=${ULPF_OPENSEARCH_PASSWORD}
      - ULPF_OPENSEARCH_INDEX_PREFIX=${ULPF_OPENSEARCH_INDEX_PREFIX:-ulpf-events-v1}
      - ULPF_QUEUE_BACKEND=sqlite_queue
      - ULPF_WORKER_CONCURRENCY=${ULPF_WORKER_CONCURRENCY:-4}
      - PYTHONUNBUFFERED=1
    networks:
      - ulpf-airgap-net

volumes:
  ulpf_minio_data:
    driver: local
  ulpf_opensearch_data:
    driver: local
  ulpf_app_data:
    driver: local

networks:
  ulpf-airgap-net:
    driver: bridge
    internal: true
