version: '3.8'

# ==============================================================================
# ULPF — Universal Log Pre-processing Framework (SIH26156 / NTRO)
# Production Air-Gapped Stack (MinIO + OpenSearch + API + Workers)
# ==============================================================================

services:
  minio:
    image: minio/minio:RELEASE.2024-08-03T04-33-23Z
    container_name: ulpf-minio-raw-store
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
    ports:
      - "9000:9000"      # S3 API
      - "9001:9001"      # Web Console
    volumes:
      - ulpf_minio_data:/data
    networks:
      - ulpf-airgap-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: ulpf-opensearch-siem
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "9200:9200"      # REST Search API
      - "9600:9600"      # Performance Analyzer
    volumes:
      - ulpf_opensearch_data:/usr/share/opensearch/data
    networks:
      - ulpf-airgap-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 20s
      timeout: 5s
      retries: 5

  ulpf-api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ulpf-api-gateway
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    ports:
      - "8000:8000"      # Dashboard UI & REST API
      - "5140:5140/udp"  # UDP Syslog Ingestion
      - "1514:1514"      # TCP Syslog Ingestion
    volumes:
      - ulpf_app_data:/app/data
    environment:
      - ULPF_ENV=production
      - ULPF_DEMO_MODE=false
      - ULPF_AIR_GAPPED=1
      - ULPF_SECRET_KEY=ulpf-ntro-sih2026-production-airgap-secret-key-32bytes
      - ULPF_STORAGE_BACKEND=minio
      - ULPF_MINIO_ENDPOINT=minio:9000
      - ULPF_MINIO_ACCESS_KEY=minioadmin
      - ULPF_MINIO_SECRET_KEY=minioadmin123
      - ULPF_MINIO_RAW_BUCKET=ulpf-raw
      - ULPF_SEARCH_BACKEND=opensearch
      - ULPF_OPENSEARCH_URL=http://opensearch:9200
      - ULPF_OPENSEARCH_INDEX_PREFIX=ulpf-events-v1
      - PYTHONUNBUFFERED=1
    networks:
      - ulpf-airgap-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/pipeline/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  ulpf-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ulpf-processing-worker
    restart: unless-stopped
    command: ["python", "-m", "ulpf.services.processing.worker"]
    depends_on:
      minio:
        condition: service_healthy
      opensearch:
        condition: service_healthy
    volumes:
      - ulpf_app_data:/app/data
    environment:
      - ULPF_ENV=production
      - ULPF_DEMO_MODE=false
      - ULPF_AIR_GAPPED=1
      - ULPF_SECRET_KEY=ulpf-ntro-sih2026-production-airgap-secret-key-32bytes
      - ULPF_STORAGE_BACKEND=minio
      - ULPF_MINIO_ENDPOINT=minio:9000
      - ULPF_MINIO_ACCESS_KEY=minioadmin
      - ULPF_MINIO_SECRET_KEY=minioadmin123
      - ULPF_MINIO_RAW_BUCKET=ulpf-raw
      - ULPF_SEARCH_BACKEND=opensearch
      - ULPF_OPENSEARCH_URL=http://opensearch:9200
      - ULPF_WORKER_CONCURRENCY=4
      - PYTHONUNBUFFERED=1
    networks:
      - ulpf-airgap-net

volumes:
  ulpf_minio_data:
    driver: local
  ulpf_opensearch_data:
    driver: local
  ulpf_app_data:
    driver: local

networks:
  ulpf-airgap-net:
    driver: bridge
    internal: false
