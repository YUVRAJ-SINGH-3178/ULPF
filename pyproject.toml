[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ulpf"
version = "1.0.0"
description = "Universal Log Pre-processing Framework (ULPF) - Lossless, OCSF-Standardized Cyber Telemetry Normalization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Yuvraj Singh", email = "satishyuvraj.singh3178@gmail.com" }
]
maintainers = [
    { name = "Yuvraj Singh", email = "satishyuvraj.singh3178@gmail.com" }
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.4.0",
    "drain3>=0.9.11",
    "duckdb>=1.1.0",
    "pyarrow>=17.0.0",
    "PyJWT>=2.9.0",
    "passlib>=1.7.4",
    "bcrypt>=4.0.0",
    "psutil>=6.0.0",
    "minio>=7.2.0",
    "opensearch-py>=2.4.0",
    "pyyaml>=6.0.2",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "BLE001",
    "PERF102",
    "F841",
    "TRY004",
    "RUF059",
    "C414",
    "S110",
    "SIM102",
    "RUF012",
    "DTZ007",
    "SIM113",
    "PIE810",
    "B008",
    "UP017",
]
